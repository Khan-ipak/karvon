services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: karvon
      POSTGRES_USER: karvon
      POSTGRES_PASSWORD: karvon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karvon"]
      interval: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      KARVON_DATABASE_URL: postgresql+psycopg://karvon:karvon@db:5432/karvon
      # Demo trucks and demo users (password = username). Use "0" for a real terminal
      # and set KARVON_ADMIN_PASSWORD to create the first admin.
      KARVON_SEED_DEMO: "1"
      KARVON_ADMIN_PASSWORD: ${KARVON_ADMIN_PASSWORD:-}
      KARVON_TERMINAL_NAME: Demo Border Terminal
      KARVON_DEFAULT_LANGUAGE: en
      KARVON_CURRENCY: USD
      KARVON_TIMEZONE: Asia/Tashkent
    ports:
      - "8000:8000"

volumes:
  pgdata:
