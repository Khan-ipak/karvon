name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Gate in a truck with plate ...
        2. Park it in slot ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Karvon version or commit
      placeholder: v0.1.0
  - type: dropdown
    id: setup
    attributes:
      label: How do you run Karvon?
      options:
        - docker compose
        - pip / uvicorn (SQLite)
        - other
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Error messages from the terminal or the browser. Remove passport numbers and other personal data.
      render: text
