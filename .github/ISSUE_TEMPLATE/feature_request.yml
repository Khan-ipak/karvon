name: Feature request
description: Suggest something Karvon should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the real situation at the terminal. "The accountant needs ..." is more useful than "add a button".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
      description: Paper, Excel, another system?
