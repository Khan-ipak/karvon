name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: karvon
          POSTGRES_PASSWORD: karvon
          POSTGRES_DB: karvon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U karvon"
          --health-interval 3s
          --health-retries 20
    env:
      KARVON_TEST_POSTGRES_URL: postgresql+psycopg://karvon:karvon@localhost:5432/karvon_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,postgres]"
      - run: pytest -q tests/test_migrations.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t karvon .

  # Redeploy the public demo (render.yaml) once main is green. Needs the repository
  # secret RENDER_DEPLOY_HOOK: the service's Deploy Hook URL from Render's settings.
  # Forks and repositories without the secret skip this step.
  deploy-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, postgres, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK is not set; skipping the demo deploy"
            exit 0
          fi
          curl --fail --silent --show-error --max-time 30 -X POST "$HOOK" > /dev/null
          echo "Demo deploy started for ${GITHUB_SHA::7}"
